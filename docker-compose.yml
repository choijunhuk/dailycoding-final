services:
  mysql:
    image: mysql:8.0
    container_name: dailycoding-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-dailycoding}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dailycoding-net

  redis:
    image: redis:7-alpine
    container_name: dailycoding-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - dailycoding-net

  backend:
    build:
      context: ./dailycoding-server
      dockerfile: Dockerfile
    container_name: dailycoding-backend
    restart: always
    env_file:
      - ./dailycoding-server/.env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # JUDGE_MODE=docker: untrusted submissions run in throwaway containers,
      # isolated from this backend's filesystem, env, and dailycoding-net.
      # Never set JUDGE_MODE=native here — it would execute submissions in the
      # same process tree that holds DB credentials and Redis access.
      JUDGE_MODE: docker
    volumes:
      # Required for JUDGE_MODE=docker. Treated as root-equivalent on host;
      # do not expose this container to untrusted network input beyond /api.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dailycoding-net

volumes:
  mysql_data:
  redis_data:

networks:
  dailycoding-net:
    driver: bridge
